<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret Chat</title>
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }
    #secretKey {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #chatBox {
      width: 100%;
      height: 300px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: none;
      background-color: #fdfdfd;
      overflow-y: auto;
    }
    #messageInput {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #sendBtn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #sendBtn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div id="container">
    <input type="password" id="secretKey" placeholder="Enter Secret Code" />
    <textarea id="chatBox" readonly></textarea>
    <input type="text" id="messageInput" placeholder="Type your message..." />
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const secretCode = "deep";
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const secretKey = document.getElementById("secretKey");
    const sendBtn = document.getElementById("sendBtn");

    let messages = [];

    function getStorageKey() {
      return `chatMessages_${secretCode}`;
    }

    function displayMessages() {
      chatBox.value = messages.map(msg => `> ${msg}`).join("\n");
    }

    function loadMessages() {
      const stored = localStorage.getItem(getStorageKey());
      messages = stored ? JSON.parse(stored) : [];
      displayMessages();
    }

    secretKey.addEventListener("input", () => {
      if (secretKey.value === secretCode) {
        loadMessages();
      } else {
        chatBox.value = "";
      }
    });

    sendBtn.addEventListener("click", () => {
      if (secretKey.value !== secretCode) {
        alert("Wrong secret code!");
        return;
      }
      const msg = messageInput.value.trim();
      if (msg) {
        messages.push(msg);
        localStorage.setItem(getStorageKey(), JSON.stringify(messages));
        messageInput.value = "";
        displayMessages();
      }
    });
  </script>
</body>
</html>
